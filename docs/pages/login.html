<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · HDVganado</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/forms.css">
</head>
<body data-root="../" data-page="login" data-title="Iniciar sesión">
<main class="login-wrap">
  <section class="card login-card">
    <div class="login-brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#2f5d3f"/><path d="M6 12c2 6 5 8 8 8M34 12c-2 6-5 8-8 8" stroke="#e7f0e9" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M13 18h14l-2 12a5 5 0 0 1-10 0z" fill="#e7f0e9"/><circle cx="17.5" cy="25" r="1.3" fill="#2f5d3f"/><circle cx="22.5" cy="25" r="1.3" fill="#2f5d3f"/></svg>
      <strong>HDVganado</strong>
    </div>
    <h1>Iniciar sesión</h1>
    <p class="muted">Ingrese con el usuario autorizado para administrar la finca.</p>
    <div id="login-msg" hidden></div>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="usuario">Usuario</label>
        <input id="usuario" name="usuario" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="usuario-err">
        <p class="field-error" id="usuario-err" hidden></p>
      </div>
      <div class="field">
        <label for="clave">Contraseña</label>
        <input id="clave" name="clave" type="password" autocomplete="current-password" aria-describedby="clave-err">
        <p class="field-error" id="clave-err" hidden></p>
      </div>
      <label class="check"><input type="checkbox" id="ver-clave"> Mostrar contraseña</label>
      <button class="btn btn-primary" type="submit">Entrar</button>
    </form>
  </section>
</main>
<script src="../js/api.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
