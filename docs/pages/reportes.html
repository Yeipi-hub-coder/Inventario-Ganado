<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reportes y exportaciones · HDVganado</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/forms.css">
</head>
<body data-root="../" data-page="reportes" data-title="Reportes y exportaciones">
<div class="shell">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main">
    <header id="topbar" class="topbar"></header>
    <main id="content" class="content">
      <div class="page-head"><h1>Reportes y exportaciones</h1><p class="muted">El CSV lo genera el backend y corresponde a la última consulta realizada.</p></div>
      <section class="card">
        <div class="field" style="max-width:380px;margin-bottom:1rem"><label for="tipo">Tipo de reporte</label><select id="tipo"></select></div>
        <form id="rep-form" class="filters" novalidate>
          <div id="rep-params" style="display:contents"></div>
          <div class="filter-actions">
            <button class="btn btn-primary" type="submit">Consultar</button>
            <button class="btn btn-ghost" type="button" id="rep-csv" disabled>Exportar CSV</button>
          </div>
        </form>
        <p id="rep-msg" hidden></p>
      </section>
      <section class="card" id="rep-card" hidden>
        <div class="result-head"><h2 id="rep-title"></h2><span id="rep-count" class="badge"></span></div>
        <div id="rep-result" aria-live="polite"></div>
      </section>
    </main>
  </div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="../js/api.js"></script>
<script src="../js/common.js"></script>
<script src="../js/reportes.js"></script>
</body>
</html>
