spring.application.name=HDVganado

# Conexion a MySQL en Aiven
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Validar la estructura existente sin modificarla
spring.jpa.hibernate.ddl-auto=validate

# conserva los nombres fisicos definidos en las anotaciones
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# SQL en consola para desarrollo
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Codigo de administrador para operaciones autorizadas
inventario.admin-code=${INVENTARIO_ADMIN_CODE}

spring.security.user.name=${APP_USER}
spring.security.user.password=${APP_PASSWORD}
server.port=${PORT:8080}